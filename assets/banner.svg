<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Styles and Animations -->
    <style>
      .radar-sweep {
        animation: sweep 6s linear infinite;
        transform-origin: 1050px 180px;
      }
      @keyframes sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .pulse-glow {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.97); }
        100% { opacity: 0.8; transform: scale(1.03); }
      }
      .beam-scan {
        animation: scanLine 4s ease-in-out infinite alternate;
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translateY(260px); opacity: 0.2; }
      }
      .dot-blink {
        animation: blink 2s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0% { opacity: 0.2; }
        100% { opacity: 1; }
      }
      .badge-float {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="260" y1="0" x2="260" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="460" y1="0" x2="460" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="660" y1="0" x2="660" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="860" y1="0" x2="860" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1060" y1="0" x2="1060" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Glowing Ambient Orb -->
  <circle cx="1050" cy="180" r="140" fill="url(#glowCircle)" class="pulse-glow" />
  <circle cx="200" cy="180" r="160" fill="url(#glowCircle)" opacity="0.5" />

  <!-- Animated Scan Beam -->
  <g class="beam-scan">
    <rect x="60" y="50" width="800" height="2" fill="url(#scanGrad)" />
  </g>

  <!-- Left / Main Content -->
  <g transform="translate(80, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 52)" class="badge-float">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="5" fill="#10b981" class="dot-blink" />
      <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Online Proctoring</text>
    <text x="0" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Online Proctoring</text>

    <!-- Subtitle -->
    <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Remote Exam Integrity • AI &amp; Live Monitoring • Browser Lockdown • Biometrics
    </text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 218)">
      <!-- Pill 1: AI Proctoring -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" />
        <text x="28" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">AI Proctoring</text>
      </g>

      <!-- Pill 2: Secure Browser -->
      <g transform="translate(150, 0)">
        <rect width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="16" cy="17" r="4" fill="#818cf8" />
        <text x="28" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Secure Browsers</text>
      </g>

      <!-- Pill 3: Anti-Cheating -->
      <g transform="translate(310, 0)">
        <rect width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="16" cy="17" r="4" fill="#c084fc" />
        <text x="28" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Anti-Cheating CV</text>
      </g>

      <!-- Pill 4: Open Source & SaaS -->
      <g transform="translate(470, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="16" cy="17" r="4" fill="#34d399" />
        <text x="28" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">SaaS &amp; Open Source</text>
      </g>
    </g>

    <!-- Bottom Meta Note -->
    <text x="0" y="295" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      ⚡ Comprehensive Directory for Educators, Universities, Certifications &amp; Developers
    </text>
  </g>

  <!-- Right Visual: Interactive AI Proctoring Radar & Eye Graphic -->
  <g transform="translate(1020, 180)">
    <!-- Outer concentric radar rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.8" />
    
    <!-- Crosshairs -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 0 0 L 70 -70 A 100 100 0 0 1 100 0 Z" fill="url(#titleGrad)" opacity="0.25" />
      <line x1="0" y1="0" x2="100" y2="0" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- Target Dots in Radar -->
    <circle cx="35" cy="-40" r="4" fill="#38bdf8" class="dot-blink" />
    <circle cx="-50" cy="30" r="3" fill="#f43f5e" class="dot-blink" />
    <circle cx="45" cy="50" r="3.5" fill="#10b981" class="dot-blink" />

    <!-- Central Security Shield / Eye Node -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#818cf8" class="pulse-glow" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
